name: DugganUSA Checks
description: Checks new dependencies and MCP servers in pull requests for malicious packages, known vulns and unknown servers.
author: DugganUSA LLC
branding:
  icon: shield
  color: blue

inputs:
  api-key:
    description: Optional DugganUSA API key (pass it from a secret). Sent only as an Authorization Bearer header. Keyless works at the anonymous free rate.
    required: false
    default: ''
  fail-on:
    description: Lowest verdict that fails the job. block (default) fails on BLOCK only; review also fails on REVIEW and ADVISORY; none never fails on a verdict.
    required: false
    default: block
  fail-on-unknown:
    description: Fail the job on UNKNOWN of class not_in_corpus (the API answered and holds no record, or a remote MCP server). Default false, but every UNKNOWN is still annotated and never counted as a pass.
    required: false
    default: 'false'
  fail-on-unchecked:
    description: Fail the job on UNKNOWN of class unchecked (a clean identity the API never judged - unreachable, 5xx, timeout, HTTP 429 past the wait budget, max-lookups cap). A pull request can pad itself to exhaust a rate budget or cap, so this defaults to true.
    required: false
    default: 'true'
  allow-ambiguous:
    description: Owner gate. Newline list of sha256 fingerprints (optionally prefixed by a label such as ".mcp.json#filesystem") of exact ambiguous MCP entries to accept. Honored only when the fingerprint matches the entry AND its launcher context as they stand (any change re-triggers), and only when every reason on the entry is entry_shape; context-derived reasons are never waivable. Honored entries are listed as ALLOWED BY OWNER, and the package they fetch is still checked.
    required: false
    default: ''
  fail-on-ambiguous:
    description: Fail the job on UNKNOWN of class ambiguous (evasion-shaped - non-canonical MCP launcher, git/URL/file/tarball/alias spec, duplicate or prototype-shaped key, unresolvable override, Gemfile code, a depth/size/count limit hit, an unparsed manifest kind, a non-plain packageManager). Default true.
    required: false
    default: 'true'
  mode:
    description: auto (diff on pull_request and merge_group, full scan on push, schedule and workflow_dispatch), diff, or full.
    required: false
    default: auto
  base-ref:
    description: Commit to diff against in diff mode. Defaults to the pull request base SHA.
    required: false
    default: ''
  include-transitive:
    description: Check transitive packages from lockfiles. auto = yes in diff mode (new transitives are the supply-chain risk), no on full scans (rate budget).
    required: false
    default: auto
  check-mcp:
    description: Check MCP server configs (any mcp.json or *.mcp.json, claude_desktop_config.json, .claude/settings.json, .vscode/settings.json, .gemini/settings.json, .cursor/settings.json) with Dredd.
    required: false
    default: 'true'
  max-lookups:
    description: Maximum API lookups per run. Items past the cap are reported as UNKNOWN (unchecked, which fails by default since a PR can pad itself past a cap), never as passed.
    required: false
    default: '200'
  rate-per-minute:
    description: Client-side pacing for package lookups. 0 = auto (10/min keyless, 60/min keyed), matching the server caps.
    required: false
    default: '0'
  max-wait-seconds:
    description: Total time the run may spend waiting out HTTP 429 rate limits before reporting the rest as UNKNOWN.
    required: false
    default: '300'
  working-directory:
    description: Directory to scan, relative to the workspace.
    required: false
    default: '.'
  api-base:
    description: API base URL (for testing). Must be https.
    required: false
    default: https://analytics.dugganusa.com

outputs:
  result:
    description: pass or fail
  block-count:
    description: Number of BLOCK verdicts
  review-count:
    description: Number of REVIEW plus ADVISORY verdicts
  unknown-count:
    description: Number of UNKNOWN (not judged) items, both classes
  ambiguous-count:
    description: Number of UNKNOWN items of class ambiguous (evasion-shaped)
  owner-allowed-count:
    description: Number of ambiguous MCP entries accepted through allow-ambiguous
  unchecked-count:
    description: Number of UNKNOWN items of class unchecked (API never judged them)
  allow-count:
    description: Number of ALLOW verdicts
  report-path:
    description: Path to a JSON report with every verdict, reason and evidence

runs:
  using: node24
  main: src/index.js
